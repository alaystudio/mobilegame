# iOS derleyip TestFlight'a yükler. Mac gerekmez: GitHub'ın macOS makinesinde çalışır.
# Arşiv otomatik imzalamayla (geliştirme profili) alınır; bunun için Apple hesabında en az bir
# kayıtlı iPhone gerekir. Dışa aktarma adımı App Store dağıtım imzasını otomatik atar.
# Tetikleme: `ios-v*` etiketi push etmek (ör. git tag ios-v1.0.1 && git push origin ios-v1.0.1).
# Gerekli repo secret'ları (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID   : Apple Developer takım kimliği (10 karakter)
#   ASC_KEY_ID      : App Store Connect API anahtar kimliği
#   ASC_ISSUER_ID   : App Store Connect API issuer kimliği
#   ASC_KEY_P8      : İndirilen AuthKey_XXXX.p8 dosyasının tüm içeriği
name: iOS → TestFlight

on:
  push:
    tags: ['ios-v*']

jobs:
  testflight:
    runs-on: macos-15
    env:
      TEAM: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Xcode 26 seç
        run: |
          # App Store Connect yalnızca iOS 26 SDK (Xcode 26+) ile derlenen uygulamaları kabul ediyor
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then
            echo "::error::Makinede Xcode 26 yok. Mevcut: $(ls -d /Applications/Xcode*.app | xargs -n1 basename | tr '\n' ' ')"
            exit 1
          fi
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Web dosyalarını derle ve iOS projesine kopyala
        run: |
          npm ci
          npm run build
          npx cap sync ios

      - name: Secret kontrolü
        run: |
          for v in TEAM KEY_ID ISSUER; do
            if [ -z "${!v}" ]; then echo "::error::$v secret'ı boş"; else echo "$v tanımlı"; fi
          done
          if [ -z "${{ secrets.ASC_KEY_P8 }}" ]; then echo "::error::ASC_KEY_P8 secret'ı boş"; else echo "ASC_KEY_P8 tanımlı"; fi

      - name: App Store Connect API anahtarını yaz
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "${{ secrets.ASC_KEY_P8 }}" > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"

      - name: Arşivle (otomatik imzalama)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER" \
            DEVELOPMENT_TEAM="$TEAM" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} 2>&1 | tee "$RUNNER_TEMP/archive.log"

      - name: Dışa aktar ve App Store Connect'e yükle
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER" 2>&1 | tee "$RUNNER_TEMP/export.log"

      - name: Hata özetini göster
        if: failure()
        run: |
          # Loglar giriş yapmadan görünmediği için hata satırlarını açık notlara (annotation) yaz
          cat "$RUNNER_TEMP"/*.log 2>/dev/null \
            | grep -E "error:|Error Domain|No Account|No profiles|requires a development team|not found|Signing|provisioning" \
            | grep -v "^\s*$" | sort -u | head -15 \
            | while IFS= read -r l; do echo "::error::$l"; done

      - name: Anahtarı sil
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
