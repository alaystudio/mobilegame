<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#161b36">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Drift Garden">
<meta name="description" content="Pop drifting balloons, play the melody yourself, and grow a quiet night garden.">
<title>Drift Garden</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="scene"></canvas>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></symbol>
  <symbol id="i-orb" viewBox="0 0 24 24"><circle cx="12" cy="10" r="6.5"/><path d="M12 16.5c-1 1.5 1 2.5 0 4.5"/></symbol>
  <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M5 19C5 11 11 5 19 5c0 8-6 14-14 14z"/><path d="M5 19l8-8"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor" stroke="none"/></symbol>
</svg>

<!-- GARDEN (home) -->
<section id="home" class="layer">
  <header class="top">
    <h1 class="brand" data-i18n="appName">Drift Garden</h1>
    <div class="top-right">
      <div class="pill"><span class="star">✦</span> <span id="stars">0</span></div>
      <button class="icon-btn" id="settingsBtn" data-i18n-aria="settings"><svg><use href="#i-sliders"/></svg></button>
    </div>
  </header>
  <div class="home-bottom">
    <div class="next-card glass">
      <div class="eyebrow" data-i18n="upNext">Up next</div>
      <div class="next-title" id="nextTitle"></div>
      <div class="next-origin" id="nextOrigin"></div>
      <button class="btn primary" id="playBtn"><svg><use href="#i-play"/></svg><span data-i18n="play">Play</span></button>
      <button class="unlock-chip hidden" id="homeUnlock"><span class="eyebrow" data-i18n="newSongReady">New song ready</span><span id="homeUnlockText"></span></button>
    </div>
    <nav class="nav">
      <button class="nav-btn glass" id="songsBtn"><svg><use href="#i-music"/></svg><span data-i18n="songs">Songs</span></button>
      <button class="nav-btn glass" id="balloonsBtn"><svg><use href="#i-orb"/></svg><span data-i18n="balloons">Balloons</span></button>
      <button class="nav-btn glass" id="gardenBtn"><svg><use href="#i-leaf"/></svg><span data-i18n="garden">Garden</span></button>
    </nav>
  </div>
</section>

<!-- PLAYING -->
<section id="playUi" class="layer hidden">
  <header class="play-top">
    <button class="icon-btn" id="quitBtn" data-i18n-aria="backToGarden"><svg><use href="#i-close"/></svg></button>
    <div class="song-info glass">
      <div class="song-name" id="songName"></div>
      <div class="progress"><div id="progressFill"></div></div>
    </div>
  </header>
  <label class="tempo glass" for="tempo">
    <span data-i18n="slow">Slow</span>
    <input type="range" id="tempo" min="0.5" max="1.8" step="0.1" data-i18n-aria="tempo">
    <span data-i18n="fast">Fast</span>
  </label>
  <div class="hint hidden" id="hint"></div>
</section>

<!-- SONG COMPLETE -->
<section id="done" class="layer modal hidden">
  <div class="card glass">
    <div class="eyebrow" data-i18n="songComplete">Song complete</div>
    <h2 id="doneSong"></h2>
    <div class="rewards">
      <div><b id="doneStars">+8</b><span data-i18n="starsLabel">stars</span></div>
      <div><canvas id="doneBloom" width="96" height="96"></canvas><span id="doneBloomText"></span></div>
    </div>
    <p class="break-note hidden" id="breakNote"></p>
    <button class="btn unlock hidden" id="unlockBtn"></button>
    <p class="unlock-progress hidden" id="unlockProgress"></p>
    <button class="btn primary" id="againBtn"></button>
    <button class="btn quiet" id="homeBtn" data-i18n="backToGarden">Back to garden</button>
  </div>
</section>

<!-- SONGS -->
<section id="songs" class="sheet hidden">
  <div class="sheet-panel">
    <div class="sheet-head">
      <h2 data-i18n="songs">Songs</h2>
      <div class="pill"><span class="star">✦</span> <span class="starCount">0</span></div>
      <button class="close" data-close data-i18n-aria="close"><svg><use href="#i-close"/></svg></button>
    </div>
    <ul class="list" id="songList"></ul>
  </div>
</section>

<!-- BALLOONS -->
<section id="balloons" class="sheet hidden">
  <div class="sheet-panel">
    <div class="sheet-head">
      <h2 data-i18n="balloons">Balloons</h2>
      <div class="pill"><span class="star">✦</span> <span class="starCount">0</span></div>
      <button class="close" data-close data-i18n-aria="close"><svg><use href="#i-close"/></svg></button>
    </div>
    <p class="sheet-note" data-i18n="balloonsNote"></p>
    <div class="grid" id="balloonGrid"></div>
  </div>
</section>

<!-- GARDEN SHOP -->
<section id="garden" class="sheet hidden">
  <div class="sheet-panel">
    <div class="sheet-head">
      <h2 data-i18n="garden">Garden</h2>
      <div class="pill"><span class="star">✦</span> <span class="starCount">0</span></div>
      <button class="close" data-close data-i18n-aria="close"><svg><use href="#i-close"/></svg></button>
    </div>
    <p class="sheet-note" data-i18n="gardenNote"></p>
    <ul class="list" id="decorList"></ul>
    <p class="muted" id="bloomCount"></p>
  </div>
</section>

<!-- SETTINGS -->
<section id="settings" class="sheet hidden">
  <div class="sheet-panel">
    <div class="sheet-head">
      <h2 data-i18n="settings">Settings</h2>
      <button class="close" data-close data-i18n-aria="close"><svg><use href="#i-close"/></svg></button>
    </div>
    <div class="settings">
      <label class="set-row" for="setVol">
        <span data-i18n="musicVolume">Music volume</span>
        <input type="range" id="setVol" min="0" max="100" step="5">
      </label>
      <label class="set-row" for="setMode">
        <span><span data-i18n="playMode">Play mode</span><small data-i18n="playModeSub"></small></span>
        <select id="setMode">
          <option value="order" data-i18n="modeOrder">In order</option>
          <option value="any" data-i18n="modeAny">Any balloon</option>
        </select>
      </label>
      <label class="set-row" for="setGuide">
        <span><span data-i18n="guide">Melody guide</span><small data-i18n="guideSub"></small></span>
        <input type="checkbox" id="setGuide" class="switch">
      </label>
      <label class="set-row" for="setAmb">
        <span><span data-i18n="gardenSounds">Garden sounds</span><small data-i18n="gardenSoundsSub"></small></span>
        <input type="checkbox" id="setAmb" class="switch">
      </label>
      <label class="set-row" for="setVibe">
        <span data-i18n="haptics">Haptics</span>
        <input type="checkbox" id="setVibe" class="switch">
      </label>
      <label class="set-row" for="setCalm">
        <span><span data-i18n="calmMotion">Calm motion</span><small data-i18n="calmMotionSub"></small></span>
        <input type="checkbox" id="setCalm" class="switch">
      </label>
      <label class="set-row" for="setBreak">
        <span><span data-i18n="breakReminder">Break reminder</span><small data-i18n="breakReminderSub"></small></span>
        <select id="setBreak"></select>
      </label>
    </div>
    <p class="muted" data-i18n="disclaimer"></p>
  </div>
</section>

<div id="toasts"></div>

<script src="i18n.js"></script>
<script src="songs.js"></script>
<script src="game.js"></script>
</body>
</html>
