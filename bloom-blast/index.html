<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1f4d3a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Clear lines, earn seeds and grow a garden that blooms with every combo.">
<title>Bloom Blast</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="cv"></canvas>

<!-- HOME: the garden is drawn on the canvas behind -->
<section id="home" class="layer">
  <header class="bar">
    <div class="brand" data-i18n="appName">Bloom Blast</div>
    <div class="pill seeds" data-i18n-aria="seeds"><span aria-hidden="true">🌱</span> <span id="homeSeeds">0</span></div>
    <button class="icon-btn" id="settingsBtn" data-i18n-aria="settings">⚙</button>
  </header>
  <div class="spacer"></div>
  <div class="home-bottom">
    <p class="welcome hidden" id="welcome" data-i18n="welcome"></p>
    <div class="task" id="taskCard">
      <div class="task-top">
        <div class="task-text">
          <div class="eyebrow" id="chapterLbl"></div>
          <div class="task-name" id="taskName"></div>
        </div>
        <button class="btn build" id="buildBtn"></button>
      </div>
      <div class="track"><div id="taskFill"></div></div>
    </div>
    <button class="btn primary big" id="playBtn"><span id="playLbl"></span><small data-i18n="adventure">Adventure</small></button>
    <div class="row2">
      <button class="btn secondary" id="classicBtn"><span data-i18n="classic">Classic</span><small id="classicSub"></small></button>
      <button class="btn secondary" id="levelsBtn"><span data-i18n="levels">Levels</span><small id="levelsSub"></small></button>
    </div>
  </div>
</section>

<!-- MAP -->
<section id="map" class="layer hidden">
  <header class="bar">
    <button class="icon-btn" id="mapBack" data-i18n-aria="back">‹</button>
    <h2 data-i18n="levels">Levels</h2>
    <div class="pill">★ <span id="mapStars">0</span></div>
  </header>
  <div class="map-scroll" id="mapScroll"><ol class="path" id="path"></ol></div>
</section>

<!-- GAME HUD -->
<section id="hud" class="layer hidden">
  <header class="bar">
    <button class="icon-btn" id="hudBack" data-i18n-aria="back">‹</button>
    <div class="hud-title">
      <div id="hudLabel"></div>
      <div class="hud-score" id="hudScore">0</div>
    </div>
    <div class="goals" id="goals"></div>
  </header>
</section>

<!-- LEVEL INTRO -->
<section id="intro" class="layer modal hidden">
  <div class="card">
    <div class="eyebrow" id="introLevel"></div>
    <h2 id="introGoal"></h2>
    <div class="goal-row" id="introGoals"></div>
    <p class="sub hidden" id="introSub"></p>
    <div class="hard-tag hidden" id="introHard" data-i18n="hardLevel">Hard level</div>
    <button class="btn primary" id="introStart" data-i18n="start">Start</button>
  </div>
</section>

<!-- RESULT -->
<section id="result" class="layer modal hidden">
  <div class="card">
    <div class="result-stars" id="resStars"></div>
    <h2 id="resTitle"></h2>
    <p class="sub" id="resSub"></p>
    <div class="big-num" id="resScore"></div>
    <div class="seed-gain" id="resSeeds"></div>
    <button class="btn build wide hidden" id="resBuild"></button>
    <button class="btn primary" id="resPrimary"></button>
    <button class="btn ghost" id="resSecondary"></button>
  </div>
</section>

<!-- BUILD -->
<section id="build" class="layer modal hidden">
  <div class="card">
    <div class="eyebrow" id="buildChapter"></div>
    <h2 id="buildTitle"></h2>
    <p class="sub" data-i18n="pickStyle">Pick a style</p>
    <div class="options" id="buildOpts"></div>
    <button class="btn build wide" id="buildGo"></button>
    <p class="sub hidden" id="buildNeed"></p>
    <button class="btn ghost" id="buildClose" data-i18n="close">Close</button>
  </div>
</section>

<!-- SETTINGS -->
<section id="settings" class="layer modal hidden">
  <div class="card">
    <h2 data-i18n="settings">Settings</h2>
    <label class="set-row"><span data-i18n="sound">Sound</span><input type="checkbox" id="setSound" class="switch"></label>
    <label class="set-row"><span data-i18n="haptics">Haptics</span><input type="checkbox" id="setVibe" class="switch"></label>
    <label class="set-row"><span data-i18n="language">Language</span>
      <select id="setLang"><option value="en">English</option><option value="tr">Türkçe</option></select>
    </label>
    <button class="btn ghost" id="setClose" data-i18n="close">Close</button>
  </div>
</section>

<div id="toasts"></div>

<script src="i18n.js"></script>
<script src="garden.js"></script>
<script src="game.js"></script>
</body>
</html>
